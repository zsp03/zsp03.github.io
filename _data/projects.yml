- id: qr-ticket
  title: Autentikasi Tiket Berbasis QR Code
  index_title: Tiket QR Code
  index_meta: Personal
  kind: Proyek personal
  lede: >-
    Sistem verifikasi tiket real-time berbasis IoT untuk mencegah pemalsuan tiket acara.
    Pemindai mandiri dipadukan dengan dasbor pemantauan web yang responsif.
  specs:
    - key: Peran
      value: Fullstack IoT &amp; Web Developer
    - key: Konteks
      value: ESP32-CAM dengan server Laravel
    - key: Stack
      value: ESP32, C++, PHP, Laravel, Livewire, Laravel Echo, WebSockets
  media:
    - src: assets/12.png
      alt: Pemindaian QR Code tiket menggunakan ponsel
      width: 750
      height: 422
      number: "4.1"
      caption: Pemindaian tiket
      span: shot--8
    - src: assets/13.png
      alt: Diagram arsitektur sistem tiket QR Code
      width: 741
      height: 749
      number: "4.2"
      caption: Arsitektur sistem
      span: shot--4 shot--tall
    - src: assets/14.png
      alt: Rangkaian hardware ESP32-CAM dengan LED dan buzzer
      width: 892
      height: 540
      number: "4.3"
      caption: Rangkaian hardware
      span: shot--12
  notes:
    title: Arsitektur dan cara kerja
    body: >-
      Pemrosesan dan decoding QR Code dilakukan lokal di mikrokontroler menggunakan
      library Quirc C++. ESP32-CAM memanggil API server, server memvalidasi tiket, lalu
      mengirim status ke dasbor admin lewat WebSocket tanpa memuat ulang halaman.
    signals:
      - code: "200"
        label: Tiket valid
        text: LED menyala dan buzzer berbunyi dua kali.
      - code: "404"
        label: Tiket ditolak
        text: buzzer berbunyi satu kali.
